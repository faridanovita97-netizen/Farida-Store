<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARIDA-STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080a;color:#fff;font-family:'Poppins',sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%, #ff00cc44, transparent 50%), radial-gradient(circle at 0% 100%, #0066ff44, transparent 50%);z-index:-1}
header{padding:30px 20px;text-align:center}
.logo{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#ff00cc,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tagline{margin-top:8px;color:#888;font-size:12px;letter-spacing:6px}
.hero{padding:30px 20px;text-align:center}
.hero h2{font-size:26px}
.hero h2 span{color:#ff00cc}
.card{max-width:380px;margin:30px auto;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:24px;backdrop-filter:blur(20px)}
.btn{width:100%;padding:16px;border:none;border-radius:30px;font-weight:700;font-size:15px}
.btn-pink{background:linear-gradient(90deg,#ff00cc,#7a00ff);color:#fff;box-shadow:0 0 25px #ff00cc66}
.btn-wa{background:#ffffff10;border:1px solid #25D366;color:#25D366;margin-top:12px}
#preview img{width:100%;border-radius:14px;margin-top:15px}
footer{margin-top:40px;padding:20px;text-align:center;color:#444;font-size:11px}
</style>
</head>
<body>
<div class="bg"></div>
<header>
<div class="logo">FARIDA-STORE</div>
<div class="tagline">HD 4K BOOSTER</div>
</header>
<div class="hero">
<h2>Foto Buram Jadi <span>HD Jernih</span></h2>
<p style="color:#666;margin-top:10px;font-size:14px">Cocok buat SW, PP, Story IG</p>
<div class="card">
<p style="font-size:14px">📸 Pilih Foto Kamu</p>
<input type="file" id="file" accept="image/*" style="margin:15px 0;color:#888">
<div id="preview"></div>
<button class="btn btn-pink" onclick="document.getElementById('file').click()">FARIDA-STORE BOOST</button>
<button class="btn btn-wa" onclick="window.open('https://wa.me/628xxxx','_blank')">Order di WhatsApp</button>
</div>
</div>
<footer>© FARIDA-STORE • Bandar Lampung</footer>
<script>
document.getElementById('file').addEventListener('change',e=>{
 const f=e.target.files[0];
 if(f){
   const im=document.createElement('img');
   im.src=URL.createObjectURL(f);
   document.getElementById('preview').innerHTML='';
   document.getElementById('preview').appendChild(im);
 }
});
</script>
</body>
</html>
