<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARIDA-STORE - HD 4K BOOSTER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
  body{margin:0;min-height:100vh;background:#12001f;background:radial-gradient(circle at top,#4a0a6e 0%,#12001f 60%,#000 100%);color:white;font-family:'Poppins',sans-serif;display:flex;justify-content:center;padding:20px;text-align:center}
 .card{width:100%;max-width:400px}
 .title{font-weight:900;font-size:30px;color:#d6a4ff;letter-spacing:2px;text-shadow:0 0 15px #ff00ff}
 .sub{font-size:10px;letter-spacing:4px;opacity:.6;margin-bottom:15px}
  h2{font-size:20px;margin:18px 0 4px} h2 span{color:#ff5cff}
 .small{font-size:12px;opacity:.5;margin-bottom:18px}
 .box{background:rgba(255,255,255,.06);border:1px solid rgba(255,0,255,.25);border-radius:22px;padding:18px;backdrop-filter:blur(10px)}
  input[type=file]{display:none}
 .upload-label{display:block;border:1.5px dashed #ff5cff;padding:16px;border-radius:14px;cursor:pointer;background:rgba(255,0,255,.08);margin-bottom:12px}
  #preview,#canvas{width:100%;border-radius:16px;margin-top:12px;display:none;box-shadow:0 0 25px #ff00ff55}
 .btn{width:100%;padding:14px;border:none;border-radius:30px;font-weight:800;cursor:pointer;margin-top:12px;color:white}
  #processBtn{display:none;background:linear-gradient(90deg,#ff00cc,#7a00ff);box-shadow:0 0 15px #ff00cc88}
  #downloadBtn{display:none;background:linear-gradient(90deg,#00ff88,#00aaff)}
  #waBtn{display:block;background:transparent;border:1px solid #00ff88;color:#00ff88;margin-top:12px}
  #faridaImg{width:100%;border-radius:16px;box-shadow:0 0 20px #ff00ff44}
 .footer{margin-top:30px;font-size:10px;opacity:.4}
</style>
</head>
<body>
<div class="card">
  <div class="title">FARIDA-STORE</div>
  <div class="sub">HD 4K BOOSTER</div>
  <h2>Foto Buram Jadi <span>HD Jernih</span></h2>
  <div class="small">Cocok buat SW, PP, Story IG</div>

  <div class="box">
    <label for="fileInput" class="upload-label">📸 Pilih Foto Kamu<br><small style="opacity:.6">Tap disini untuk galeri</small></label>
    <input type="file" id="fileInput" accept="image/*">

    <!-- Gambar anime bawaan -->
    <img id="faridaImg" src="https://i.ibb.co/placeholder.jpg" alt="Farida Project" style="display:none">
    <!-- GANTI SRC DI ATAS KALO PUNYA LINK GAMBAR SENDIRI -->

    <img id="preview" />
    <canvas id="canvas"></canvas>

    <button class="btn" id="processBtn">FARIDA-STORE BOOST ✨</button>
    <button class="btn" id="downloadBtn">⬇ DOWNLOAD HASIL HD 4K</button>
    <button class="btn" id="waBtn">Order di WhatsApp</button>
  </div>

  <div class="footer">© FARIDA-STORE • Bandar Lampung • WA: 0895-3290-79485</div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const processBtn = document.getElementById('processBtn');
const downloadBtn = document.getElementById('downloadBtn');
const waBtn = document.getElementById('waBtn');
const waNumber = "62895329079485";
let loadedImg = null;

fileInput.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  loadedImg = new Image();
  loadedImg.onload = () => {
    preview.src = url;
    preview.style.display = 'block';
    canvas.style.display = 'none';
    processBtn.style.display = 'block';
    downloadBtn.style.display = 'none';
    processBtn.innerText = 'FARIDA-STORE BOOST ✨ - PROSES HD';
  };
  loadedImg.src = url;
};

processBtn.onclick = () => {
  if(!loadedImg){ alert('Pilih foto dulu ya!'); return; }
  const W = 2160, H = 3840;
  let scale = Math.max(W/loadedImg.width, H/loadedImg.height);
  let nw = loadedImg.width*scale, nh = loadedImg.height*scale;
  canvas.width = W; canvas.height = H;
  ctx.filter = 'blur(40px) brightness(0.5) saturate(1.5)';
  ctx.drawImage(loadedImg, 0, 0, W, H);
  ctx.filter = 'none';
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(loadedImg, (W-nw)/2, (H-nh)/2, nw, nh);
  ctx.filter = 'contrast(1.3) saturate(1.4) brightness(1.05)';
  ctx.drawImage(canvas, 0, 0);
  ctx.filter = 'none';
  let grad = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.9);
  grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(255,0,200,0.25)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  canvas.style.display = 'block';
  preview.style.display = 'none';
  downloadBtn.style.display = 'block';
  processBtn.innerText = '✅ BERHASIL JADI HD 4K!';
};

downloadBtn.onclick = () => {
  const a = document.createElement('a');
  a.download = `FARIDA-HD4K-${Date.now()}.png`;
  a.href = canvas.toDataURL('image/png', 1.0);
  a.click();
};

waBtn.onclick = () => {
  const text = encodeURIComponent("Halo Kak Farida 👋 Saya habis coba HD Booster di website FARIDA-STORE, hasilnya keren! Mau tanya order dong 😊");
  window.open(`https://wa.me/${waNumber}?text=${text}`, "_blank");
};
</script>
</body>
</html>
